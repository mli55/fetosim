<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maternal–Fetal Cross-Section</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a narrow header, then the explorer (3D stage + contraction trace on the left, part panel on the right,
   stacked on phones), then single-column reading sections: data pipeline, parameter table, feedback. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --stage: #e6ebf1;
  --stage2: #fbf9f6;
  --ink: #17202c;
  --muted: #586579;
  --line: #d6dce5;
  --maternal: #b3303e; --thorax: #23838a;
  --fetal: #3a5fa8;
  --accent: #7a3e8e;
  --on-accent: #ffffff;
  --c1: #5c6a80;
  --c2: #a5650c;
  --c3: #0a7f62;
  --c1-bg: #e8ecf2;
  --c2-bg: #f8ecd8;
  --c3-bg: #daf1e9;
  --c4: #2c62a8; --c4-bg: #dfe9f7;
  --paper: #fdf3f2;
  --grid-minor: #f2d6d6;
  --grid-major: #e3aeb0;
  --trace-ghost: #c9b6ba;
  --muscle: #e9b9b1; --muscle-hi: #b5394c; --muscle-edge: #c78a84; --m-art: #c8374a; --m-ven: #6d2c4e; --villus: #7466c0;
  --f-hi: #c2415a; --f-lo: #4a4fa6; --fv-hi: #8a4f96; --fv-lo: #3a3d80; --skin: #f9e4d7; --skin-edge: #d8b09b; --fskin: #fcc6a2; --fshade: #f08a6c; --brain: #f2cfd4;
  --jelly: #f1e8cf; --flowdot: rgba(255, 255, 255, .9); --device: #e8edf3; --device-edge: #5b6b80; --baro: #2f8fd6; --chemo: #7fae1f;
  --font-display: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Segoe UI", Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Segoe UI", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --font-math: "STIX Two Text", "Cambria Math", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #161d27; --stage: #111923; --stage2: #141c27; --ink: #e4e9f0; --muted: #9ba7b8; --line: #2a3442;
    --maternal: #e2606d; --thorax: #5cc3c8; --fetal: #7da3e6; --accent: #c08ad2; --on-accent: #1d1022;
    --c1: #a4b0c3; --c2: #e4a94f; --c3: #3fcaa0; --c1-bg: #222b38; --c2-bg: #352813; --c3-bg: #10322a; --c4: #79a8ea; --c4-bg: #14233a;
    --paper: #1b1719; --grid-minor: #2c2226; --grid-major: #4a3036; --trace-ghost: #5d4f54;
    --muscle: #6f3b47; --muscle-hi: #d0506a; --muscle-edge: #93596a; --m-art: #e0606c; --m-ven: #a3506f; --villus: #9d8fe0;
    --f-hi: #ea6c82; --f-lo: #6a72d6; --fv-hi: #b07ac0; --fv-lo: #5558a8; --skin: #3b302d; --skin-edge: #6e5349; --fskin: #8a5e4c; --fshade: #b46d55; --brain: #573840;
    --jelly: #4d473a; --flowdot: rgba(255, 255, 255, .8); --device: #2a3442; --device-edge: #9aa8bd; --baro: #5cb0f0; --chemo: #a6d24a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #161d27; --stage: #111923; --stage2: #141c27; --ink: #e4e9f0; --muted: #9ba7b8; --line: #2a3442;
  --maternal: #e2606d; --thorax: #5cc3c8; --fetal: #7da3e6; --accent: #c08ad2; --on-accent: #1d1022;
  --c1: #a4b0c3; --c2: #e4a94f; --c3: #3fcaa0; --c1-bg: #222b38; --c2-bg: #352813; --c3-bg: #10322a; --c4: #79a8ea; --c4-bg: #14233a;
  --paper: #1b1719; --grid-minor: #2c2226; --grid-major: #4a3036; --trace-ghost: #5d4f54;
  --muscle: #6f3b47; --muscle-hi: #d0506a; --muscle-edge: #93596a; --m-art: #e0606c; --m-ven: #a3506f; --villus: #9d8fe0;
  --f-hi: #ea6c82; --f-lo: #6a72d6; --fv-hi: #b07ac0; --fv-lo: #5558a8; --skin: #3b302d; --skin-edge: #6e5349; --fskin: #8a5e4c; --fshade: #b46d55; --brain: #573840;
  --jelly: #4d473a; --flowdot: rgba(255, 255, 255, .8); --device: #2a3442; --device-edge: #9aa8bd; --baro: #5cb0f0; --chemo: #a6d24a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { overscroll-behavior-y: none; }   /* no pull-to-refresh */
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
.wrap { max-width: 1240px; margin: 0 auto; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; text-wrap: balance; margin: 0; letter-spacing: 0.005em; }
h1 { font-size: clamp(30px, 4.6vw, 46px); line-height: 1.05; }
h2 { font-size: 26px; line-height: 1.15; }
h3 { font-size: 18px; line-height: 1.25; }
p { margin: 0; }
a { color: var(--accent); }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lede { max-width: 68ch; font-size: 17px; color: var(--ink); }
.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
header.top { display: grid; gap: 14px; padding-block: 36px 22px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; font-size: 14px; }
.nav { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; }
.nav a { text-decoration: none; border-bottom: 1px solid var(--line); color: var(--ink); }
.nav a:hover { border-color: var(--accent); }

/* class badges: colour + text */
.cls { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; white-space: nowrap;
  padding: 1px 8px 1px 6px; border-radius: 999px; line-height: 1.6; }
.cls::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.cls-1 { color: var(--c1); background: var(--c1-bg); }
.cls-2 { color: var(--c2); background: var(--c2-bg); }
.cls-3 { color: var(--c3); background: var(--c3-bg); }
.cls-4 { color: var(--c4); background: var(--c4-bg); }
.cls-1::before { border-radius: 50%; }
.cls-3::before, .cls-4::before { transform: rotate(45deg); }

section { padding-block: 34px 6px; display: grid; gap: 16px; }
section > header { display: grid; gap: 6px; max-width: 72ch; }

/* explorer */
.explorer { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 18px; align-items: start; }
.left { display: grid; gap: 10px; min-width: 0; }
.stage { position: relative; height: 540px; border-radius: 10px; overflow: hidden; background:
  radial-gradient(120% 90% at 60% 35%, var(--surface) 0%, var(--stage) 70%); border: 1px solid var(--line); touch-action: none; }
.stage canvas { display: block; width: 100%; height: 100%; }
.stage svg.leaders { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.leaders line { stroke: var(--muted); stroke-width: 1; opacity: .7; }
.tags { position: absolute; inset: 0; pointer-events: none; }
.tag { position: absolute; left: 0; top: 0; pointer-events: auto; transform: translate(-50%, -50%);
  font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 88%, transparent); color: var(--ink); cursor: pointer; white-space: nowrap; }
.tag { display: inline-flex; align-items: center; gap: 5px; padding-left: 3px; }
.tag .num { width: 17px; height: 17px; font-size: 10px; border-width: 1.3px; }
.tag:hover, .tag.on { border-color: var(--accent); color: var(--accent); }
.tags.off .tag { display: none; } .leaders.off { display: none; }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--muted); pointer-events: none;
  background: color-mix(in srgb, var(--surface) 75%, transparent); padding: 2px 8px; border-radius: 6px; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); }

.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 7px 11px; cursor: pointer; font-size: 14px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); font-weight: 600; }
.spacer { flex: 1 1 auto; }
.readouts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
@media (min-width: 1180px) { .readouts { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.clock { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.ro { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; min-width: 0; }
.ro .k { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ro .v { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 15px; }
.ro .v small { font-size: 11px; color: var(--muted); margin-left: 3px; }
.tracebox { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 4px; }
.tracebox canvas { display: block; width: 100%; height: 236px; cursor: pointer; touch-action: pan-y; }
.tracecap { font-size: 12.5px; color: var(--muted); padding: 2px 4px 4px; }

/* part panel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 16px 18px;
  display: grid; gap: 14px; position: sticky; top: max(12px, env(safe-area-inset-top, 0px)); max-height: calc(100vh - 24px); overflow: auto; min-width: 0; }
.panel .role { font-size: 15px; }
.panel .during { font-size: 14px; border-left: 3px solid var(--maternal); padding: 2px 0 2px 10px; color: var(--ink); }
.panel .during b { font-weight: 600; }
.filter { display: grid; gap: 6px; }
.filter .seg { width: 100%; }
.filter .seg button { flex: 1 1 0; padding: 6px 4px; font-size: 13px; }
.eqs { display: grid; gap: 8px; }
.eq { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; background: color-mix(in srgb, var(--bg) 50%, var(--surface)); }
.eq .no { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.eq .m { font-family: var(--font-math); font-size: 17px; line-height: 1.45; overflow-x: auto; }
.eq .m i { font-style: italic; }
.eq .m sub, .eq .m sup { font-size: 70%; }
.eq .why { font-size: 13px; color: var(--muted); }
.plist { display: grid; gap: 0; }
.psub { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--maternal); padding: 14px 0 4px; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.prow .sym { font-family: var(--font-math); font-style: italic; font-size: 16px; }
.prow .val { font-family: var(--font-mono); font-size: 13px; text-align: right; white-space: nowrap; }
.prow .mean { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.prow.code { cursor: pointer; } .prow.code:hover { background: color-mix(in srgb, var(--accent) 6%, transparent); }
.prow .codeat { margin-left: auto; font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-decoration: none; }
.prow.code:hover .codeat { color: var(--accent); text-decoration: underline; }
.prow .meta { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.partlist { display: grid; gap: 6px; }
.partlist button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; cursor: pointer;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; }
.partlist button:hover { border-color: var(--accent); }
.partlist .pt { font-weight: 600; }
.partlist .ps { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.back { justify-self: start; font-size: 13px; }
.only-phone { display: none; }

/* pipeline */
.pipe { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; counter-reset: step; }
.pipe .step:last-child { grid-column: 1 / -1; }
@media (min-width: 1180px) { .pipe { grid-template-columns: repeat(5, minmax(0, 1fr)); } .pipe .step:last-child { grid-column: auto; } }
@media (max-width: 600px) { .pipe { grid-template-columns: minmax(0, 1fr); } }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 14px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.step h3 { font-size: 16px; display: flex; gap: 8px; align-items: baseline; }
.step h3::before { counter-increment: step; content: counter(step); font-family: var(--font-mono); font-size: 12px; color: var(--accent);
  border: 1px solid var(--accent); border-radius: 50%; width: 20px; height: 20px; display: inline-grid; place-items: center; flex: none; }
.step p, .step li { font-size: 13.5px; }
.step ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.step svg { width: 100%; height: auto; max-height: 120px; display: block; background: var(--paper); border-radius: 6px; }
.step .m { font-family: var(--font-math); font-size: 15.5px; }
.illus { font-size: 12px; color: var(--muted); }
.windowbar { display: grid; grid-template-columns: 20fr 2fr 10fr; height: 22px; border-radius: 5px; overflow: hidden; font-size: 11px; font-family: var(--font-mono); }
.windowbar div { display: grid; place-items: center; color: var(--ink); white-space: nowrap; overflow: hidden; }
.windowbar .tr { background: var(--c3-bg); } .windowbar .gp { background: var(--line); } .windowbar .te { background: var(--c1-bg); }

/* table */
.tabtools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabtools input[type="search"], .tabtools select { font: inherit; font-size: 14px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.tabtools input[type="search"] { flex: 1 1 220px; min-width: 0; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 7px 10px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--line); }
th { font-weight: 600; font-size: 12.5px; color: var(--muted); background: color-mix(in srgb, var(--bg) 60%, var(--surface)); position: sticky; top: 0; white-space: nowrap; }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--bg) 35%, var(--surface)); }
td.sym { font-family: var(--font-math); font-style: italic; font-size: 15px; white-space: nowrap; }
td.code, td.val { font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
td.mean { min-width: 260px; }
td.note { min-width: 200px; color: var(--muted); font-size: 12.5px; }

/* feedback */
ol.fb { margin: 0; padding-left: 22px; display: grid; gap: 12px; max-width: 78ch; }
ol.fb li::marker { font-family: var(--font-mono); color: var(--accent); }
ol.fb b { font-weight: 600; }
.gaps { display: grid; gap: 8px; max-width: 78ch; }
.gaps ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
footer { padding-block: 34px 0; font-size: 13px; color: var(--muted); display: grid; gap: 6px; max-width: 90ch; }
footer code, .gaps code { font-family: var(--font-mono); font-size: 12px; }

@media (max-width: 900px) {
  .explorer { grid-template-columns: minmax(0, 1fr); }
  .panel { position: static; max-height: none; }
  .stage { height: min(64vh, 470px); }
  .only-phone { display: inline-block; }
}
@media (max-width: 480px) {
  body { font-size: 14.5px; }
  .tag { font-size: 11px; padding: 1px 6px; }
  .tracebox canvas { height: 222px; }
  .btn, .seg button { padding: 7px 9px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* shared numbering */
.num { display: inline-grid; place-items: center; width: 21px; height: 21px; border-radius: 50%; border: 1.5px solid currentColor;
  font-family: var(--font-mono); font-size: 11.5px; font-weight: 600; flex: none; line-height: 1; font-style: normal; }
.ptitle { display: flex; gap: 9px; align-items: center; }
.ptitle .num { width: 25px; height: 25px; font-size: 13px; }
.partlist .pt { display: flex; gap: 8px; align-items: center; }
td.partc { white-space: nowrap; }
td.partc .num { width: 19px; height: 19px; font-size: 10.5px; margin-right: 6px; vertical-align: -4px; display: inline-grid; }

/* parameter annotations and tips (both pages) */
.annlayer { position: absolute; inset: 0; pointer-events: none; }
.annlines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.annlines .lc { fill: none; stroke: var(--stage2, var(--stage)); stroke-width: 4.5; stroke-linecap: round; opacity: .9; }
.annlines .ll { fill: none; stroke: var(--ink); stroke-width: 1.2; stroke-linecap: round; opacity: .5; transition: stroke .15s, opacity .15s; }
.annlines .ap { fill: var(--accent); opacity: 0; transition: opacity .15s; }
.annlines .ar { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; stroke-opacity: .7; transition: stroke .15s; }
.annlines .ad { fill: var(--ink); transition: fill .15s; }
.annlines .lead.hi .ll, .annlines .lead.sel .ll { stroke: var(--accent); opacity: 1; stroke-width: 1.8; }
.annlines .lead.hi .ar, .annlines .lead.sel .ar { stroke: var(--accent); stroke-opacity: 1; stroke-width: 2; }
.annlines .lead.hi .ad, .annlines .lead.sel .ad { fill: var(--accent); }
.annlines .lead.hi .ap, .annlines .lead.sel .ap { opacity: .18; }
.ann { position: absolute; left: 0; top: 0; pointer-events: auto; font: inherit; font-size: 12px; line-height: 1.3; text-align: left;
  padding: 2px 7px 2px 6px; border-radius: 5px; border: 1px solid var(--line); border-left: 3px solid var(--c1);
  background: var(--surface); color: var(--ink); cursor: pointer; max-width: var(--annw, 220px); }
.ann.on { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); }
.prow.hit { background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: inset 3px 0 0 var(--accent); padding-left: 8px; border-radius: 4px; }
.ann.c2 { border-left-color: var(--c2); }
.ann.c3 { border-left-color: var(--c3); background: color-mix(in srgb, var(--c3-bg) 55%, var(--surface)); }
.ann.c4 { border-left-color: var(--c4); background: color-mix(in srgb, var(--c4-bg) 55%, var(--surface)); }
.ann:hover, .ann:focus-visible { border-color: var(--accent); }
.ann.grp { border-left-color: var(--accent); cursor: pointer; font-weight: 500; }
.ann.grp .gn { font-family: var(--font-mono); font-size: 11px; color: var(--muted); margin-left: 4px; }
.ann.grp.open { background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.annbox { position: absolute; left: 0; top: 0; display: grid; gap: 3px; justify-items: start; max-width: var(--annw, 210px); pointer-events: none; }
.annrows { display: grid; gap: 3px; justify-items: start; }
.annbox .ann { position: static; box-shadow: 0 1px 3px rgba(0, 0, 0, .08); }
.annh { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--muted); padding: 0 2px; line-height: 1.2;
  text-shadow: 0 0 3px var(--stage2, var(--stage)), 0 0 3px var(--stage2, var(--stage)); }
.as { font-family: var(--font-math); font-style: italic; font-size: 13.5px; }
.as .an { font-family: var(--font-body); font-style: normal; font-size: 12px; }
.av { font-family: var(--font-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.au { color: var(--muted); font-size: 11px; }
.dots3 { display: inline-flex; gap: 3px; margin-left: 5px; vertical-align: 1px; }

  if (t.startsWith('pO<sub>2</sub>,')) return t.replace(/^pO<sub>2<\/sub>,(.*)$/, 'pO<sub>2,$1</sub>');
  if (t.startsWith('cO<sub>2</sub>,')) return t.replace(/^cO<sub>2<\/sub>,(.*)$/, 'cO<sub>2,$1</sub>');
  return t;
}
function fmtNum(v) {
  if (typeof v !== 'number') return esc(v);
  if (v === 0) return '0';
  const a = Math.abs(v);
  if (a >= 1e4 || a < 1e-3) {
    const e = Math.floor(Math.log10(a)), m = v / 10 ** e;
    return `${Number(m.toPrecision(3))}×10<sup>${e}</sup>`;
  }
  return String(Number(v.toPrecision(4)));
}
function valueHTML(r) {

    return `${r.range[0]}–${r.range[1]}` + (r.grid ? `<br><span class="muted">grid ${r.grid.join(', ')}</span>` : '');
  }
  return fmtNum(r.value);
}
