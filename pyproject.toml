[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ctg-lumped-model"
version = "0.1.0"
description = "Lumped-parameter maternal-fetal circulation models for CTG (first model: Jongen et al. 2016)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["ctg_lumped*"]

[tool.setuptools.package-data]
"ctg_lumped.jongen" = ["jongen.c"]
